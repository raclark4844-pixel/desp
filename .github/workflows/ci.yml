name: APS Lead Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/aps_lead_engine
      DIRECT_URL: postgresql://user:password@localhost:5432/aps_lead_engine
      APS_INTERNAL_API_KEY: ci-only-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
